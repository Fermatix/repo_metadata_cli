[tree_sitter.lang_func_node_types]
agda = []
bash = ["function_definition"]
c = ["function_definition"]
cpp = ["function_definition"]
csharp = ["method_declaration", "constructor_declaration", "local_function_statement"]
css = []
d = ["function_declaration"]
dart = ["function_body"]
elixir = []
elm = ["value_declaration"]
erlang = ["function_clause"]
fortran = ["subroutine", "function"]
fsharp = ["function_or_value_defn"]
gdscript = ["function_definition"]
gleam = ["function"]
glsl = ["function_definition"]
go = ["function_declaration", "method_declaration"]
haskell = ["function"]
hlsl = ["function_definition"]
html = []
java = ["method_declaration", "constructor_declaration"]
javascript = ["function_declaration", "function_expression", "arrow_function", "method_definition"]
jsdoc = []
json = []
julia = ["function_definition"]
kotlin = ["function_declaration"]
lua = ["function_declaration", "function_definition"]
nim = ["proc_declaration", "func_declaration", "method_declaration", "iterator_declaration"]
nix = ["function_expression"]
objc = ["function_definition", "implementation_definition"]
ocaml = ["value_definition"]
ocaml_interface = ["value_definition"]
odin = ["procedure_declaration"]
pascal = ["defProc"]
perl = ["subroutine_declaration_statement"]
php = ["function_definition", "method_declaration"]
powershell = ["function_statement"]
python = ["function_definition"]
r = ["function_definition"]
ruby = ["method", "singleton_method"]
rust = ["function_item"]
scala = ["function_definition"]
solidity = ["function_definition"]
swift = ["function_declaration"]
toml = []
tsx = ["function_declaration", "function_expression", "arrow_function", "method_definition"]
typescript = ["function_declaration", "function_expression", "arrow_function", "method_definition"]
verilog = []
vim = ["function_definition"]
wgsl = ["function_declaration"]
zig = ["FnProto"]

[metrics]
# Dependency manager directories — excluded from Logical LOC and Auto-Generated LOC,
# reported separately in dep_dir_loc (column AE). Only meaningful when these directories
# are actually committed to git (Go vendor/, iOS Pods/, Elixir deps/, etc.).
# IMPORTANT: every entry here must also appear in scc_exclude_dirs.
dep_dirs = [
    # JavaScript / TypeScript
    "node_modules",
    "bower_components",
    "jspm_packages",
    # Go / PHP / Ruby (Bundler)
    "vendor",
    # iOS — CocoaPods (often committed to git)
    "Pods",
    # iOS — Carthage (Checkouts/ subdir sometimes committed)
    "Carthage",
    # Elixir / Erlang — mix deps
    "deps",
    # C / C++ projects (Chromium, Android NDK, game engines)
    "third_party",
    "thirdparty",
    # CMake ExternalProject / FetchContent / vcpkg
    "external",
    "vcpkg_installed",
    # .NET — NuGet (old packages/ convention). NOTE: do NOT use as default —
    # in JS/TS monorepos (Turborepo, Nx, Lerna) packages/ is own workspace source code.
    # Add manually per-project if the repo uses NuGet with committed packages/.
    # "packages",
    # R — renv library (sometimes committed)
    "renv",
    # Elm — compiler-downloaded packages (occasionally committed)
    "elm-stuff",
    # Haxe — Haxelib installed libraries
    "haxe_libraries",
    # Android legacy / old Java projects — committed JAR/AAR files
    # Note: do NOT add "lib/" here — it is source code in Flutter/Dart, Ruby, Python.
    "libs",
    # Python self-vendoring (pip, setuptools, etc. vendor their own deps)
    "_vendor",
    # Manual dependency vendoring via git submodules or copy-paste
    "submodules",
    # Xcode / Swift PM — resolved packages in CI (--package-path mode)
    "SourcePackages",
    # Lua — LuaRocks local install (analogous to node_modules)
    "lua_modules",
    # Nim — Nimble lockfile-based install
    "nimbledeps",
    # Terraform — provider binaries (discouraged to commit, but seen in practice)
    ".terraform",
]

# Directories passed to scc --exclude-dir for Logical LOC calculation.
# Must contain all dep_dirs entries plus build-artifact directories.
scc_exclude_dirs = [
    # --- Dependency directories (must mirror dep_dirs) ---
    "node_modules",
    "bower_components",
    "jspm_packages",
    "vendor",
    "Pods",
    "Carthage",
    "deps",
    "third_party",
    "thirdparty",
    "external",
    "vcpkg_installed",
    # "packages",  — see dep_dirs note; omitted to avoid excluding JS monorepo workspace packages
    "renv",
    "elm-stuff",
    "haxe_libraries",
    "libs",
    "_vendor",
    "submodules",
    "SourcePackages",
    "lua_modules",
    "nimbledeps",
    ".terraform",
    # --- Build artifact directories ---
    # Generic
    "dist",
    "build",
    "out",
    # Rust / Maven / SBT
    "target",
    # Gradle (Android, Kotlin, Java)
    ".gradle",
    # Haskell Stack
    ".stack-work",
    # OCaml opam / Dune; also Elixir mix build output
    "_opam",
    "_build",
    # Zig build system
    "zig-cache",
    "zig-out",
    # Dart / Flutter tooling cache
    ".dart_tool",
    # Nim compiler cache
    "nimcache",
    # CMake in-source build dirs (CLion default names)
    "CMakeFiles",
    "cmake-build-debug",
    "cmake-build-release",
    # Python virtualenvs / byte-code caches
    ".venv",
    "venv",
    "env",
    ".tox",
    "__pycache__",
    # Frontend framework build outputs
    ".svelte-kit",
    ".parcel-cache",
    ".turbo",
    # Unity — project Library and temp dirs (often committed but are build caches)
    "Library",
    "Temp",
    # Test / coverage output
    "coverage",
    "storybook-static",
    "htmlcov",
    "TestResults",
    # Bazel build system (Google, Android AOSP, large monorepos)
    "bazel-bin",
    "bazel-out",
    "bazel-genfiles",
    # Buck build system (Meta / Facebook projects)
    "buck-out",
    # .NET / Unity — intermediate compilation objects
    "obj",
    # Xcode — main build output (rarely committed but large when present)
    "DerivedData",
    # Python static analysis / linter caches
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    # Documentation site build outputs
    "site",
    "public",
    # React Native — Expo tooling cache
    ".expo",
    # Docusaurus framework cache
    ".docusaurus",
]

# Directories treated as auto-generated code (spec column H).
# Files in these dirs are eligible for autogen_loc only if they also fall within
# the logical_loc scope (i.e. not in scc_exclude_dirs). Dirs that appear in
# both lists (e.g. "out") are scanned for autogen patterns but contribute 0
# because the scoping filter excludes them from logical_loc first.
autogen_dirs = [
    # Generic code-generation output
    "generated",
    "gen",
    "codegen",
    "__generated__",
    # Database migrations (auto-generated by ORM tools)
    "migrations",
    # Protobuf stubs
    "pb",
    "proto_gen",
    # gRPC generated code
    "grpc",
    # OpenAPI / Swagger generated client or server code.
    # Note: also matches hand-written spec directories — verify per project.
    "openapi",
    "swagger",
    # Mock generation (Go mockery, Java Mockito generated sources, etc.)
    "mock",
    "mocks",
    # Build output — in scc_exclude_dirs so contributes 0, but listed per spec (column H)
    "out",
    # Frontend framework build/cache dirs
    ".cache",
    ".next",
    ".nuxt",
    # Test snapshots / fixtures (Jest, Vitest)
    "__snapshots__",
    "snapshots",
]

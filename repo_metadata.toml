[tree_sitter.lang_func_node_types]
agda = []
bash = ["function_definition"]
c = ["function_definition"]
cpp = ["function_definition"]
csharp = ["method_declaration", "constructor_declaration", "local_function_statement"]
css = []
d = ["function_declaration"]
dart = ["function_body"]
elixir = []
elm = ["value_declaration"]
erlang = ["function_clause"]
fortran = ["subroutine", "function"]
fsharp = ["function_or_value_defn"]
gdscript = ["function_definition"]
gleam = ["function"]
glsl = ["function_definition"]
go = ["function_declaration", "method_declaration"]
haskell = ["function"]
hlsl = ["function_definition"]
html = []
java = ["method_declaration", "constructor_declaration"]
javascript = ["function_declaration", "function_expression", "arrow_function", "method_definition"]
jsdoc = []
json = []
julia = ["function_definition"]
kotlin = ["function_declaration"]
lua = ["function_declaration", "function_definition"]
nim = ["proc_declaration", "func_declaration", "method_declaration", "iterator_declaration"]
nix = ["function_expression"]
objc = ["function_definition", "implementation_definition"]
ocaml = ["value_definition"]
ocaml_interface = ["value_definition"]
odin = ["procedure_declaration"]
pascal = ["defProc"]
perl = ["subroutine_declaration_statement"]
php = ["function_definition", "method_declaration"]
powershell = ["function_statement"]
python = ["function_definition"]
r = ["function_definition"]
ruby = ["method", "singleton_method"]
rust = ["function_item"]
scala = ["function_definition"]
solidity = ["function_definition"]
swift = ["function_declaration"]
toml = []
tsx = ["function_declaration", "function_expression", "arrow_function", "method_definition"]
typescript = ["function_declaration", "function_expression", "arrow_function", "method_definition"]
verilog = []
vim = ["function_definition"]
wgsl = ["function_declaration"]
zig = ["FnProto"]

[metrics]
# Dependency directories (spec column AE: dep_dir_loc).
# Excluded from Logical LOC and Auto-Generated LOC; counted separately.
# IMPORTANT: every entry here must also appear in scc_exclude_dirs.
dep_dirs = [
    # JavaScript / TypeScript
    "node_modules", "bower_components", "jspm_packages",
    # Go / PHP / Ruby
    "vendor", "Godeps",
    # Python (virtualenvs + installed packages + self-vendoring)
    ".venv", "venv", "site-packages", "_vendor",
    # iOS / Swift
    "Pods", "Carthage", "SourcePackages",
    # Elixir / Erlang
    "deps",
    # C / C++
    "third_party", "thirdparty", "external", "vcpkg_installed",
    # R / Elm / Haxe / Lua / Nim
    "renv", "elm-stuff", "haxe_libraries", "lua_modules", "nimbledeps",
    # Android legacy / Terraform / manual vendoring
    "libs", ".terraform", "submodules",
]

# Directories excluded from scc for Logical LOC (spec column G).
# Superset of dep_dirs: every dependency directory above PLUS build-artifact and
# tool-cache directories that hold generated or third-party code. Must contain
# all dep_dirs entries (invariant enforced at config load).
scc_exclude_dirs = [
    # --- dependency directories (must mirror dep_dirs) ---
    "node_modules", "bower_components", "jspm_packages",
    "vendor", "Godeps",
    ".venv", "venv", "site-packages", "_vendor",
    "Pods", "Carthage", "SourcePackages",
    "deps",
    "third_party", "thirdparty", "external", "vcpkg_installed",
    "renv", "elm-stuff", "haxe_libraries", "lua_modules", "nimbledeps",
    "libs", ".terraform", "submodules",
    # --- build outputs / tool caches (excluded from logical_loc only) ---
    "dist", "build", "target", ".gradle", ".dart_tool",
    "__pycache__", ".tox", "DerivedData",
]

# Directories treated as auto-generated code (spec column H: autogen_loc).
# Files here are eligible only if they also fall within the logical_loc scope
# (i.e. not in scc_exclude_dirs). "out" appears in both lists — it contributes 0
# because the scoping filter excludes it from logical_loc.
autogen_dirs = [
    "generated",
    "migrations",
    "__generated__",
    "out",
    ".next",
    ".nuxt",
    # Unity IL2CPP transpiler output (C# -> C++). Stays inside logical_loc scope
    # (not in scc_exclude_dirs), so its millions of machine-generated lines are
    # attributed to autogen_loc. Lowercase — dir names are matched via .lower().
    "il2cppoutput",
    "il2cppoutputproject",
]

# scc language names that are NOT real programming languages — excluded from
# primary_language (L), lang_distribution (M) and stack (AM); the unfiltered
# picture is kept in full_lang_distribution (AV). Mirror of the client-agreed
# NON_CODE set (repo_sample_extractor languages.py NON_CODE_LANGS +
# lord-of-the-repos concat_recalc_metadata.py EXTRA_NON_CODE); keep in sync.
# Logic-less template formats (Mustache, Handlebars, Jade, HAML) are markup;
# templates with real control flow (Twig, Smarty, Blade, ERB, Razor, JSP,
# Freemarker, Jinja, Mako) stay code. Shell/Batch/Dockerfile/Makefile/Gradle/
# Terraform stay code (sampler parity).
non_code_languages = [
    # markup / style / data / docs
    "SVG", "CSS", "Sass", "LESS", "Stylus", "HTML", "JSON", "Markdown", "MDX",
    "Plain Text", "CSV", "YAML", "TOML", "INI", "XML", "XML Schema", "XAML",
    "License", "Properties File", "Docker ignore",
    # logic-less templates
    "Mustache", "Handlebars", "Jade", "HAML",
    # notebook JSON (scc weighs the notebook JSON, not the code inside)
    "Jupyter",
    # docs/data/diff formats, XML-family build/report/interface files,
    # key-value config formats, schema/IDL (no control flow), spec text
    "ReStructuredText", "Rich Text Format", "Patch", "DOT",
    "MSBuild", "Web Services Description Language",
    "Report Definition Language", "Module-Definition",
    "Windows Resource-Definition Script",
    "Xcode Config", "Systemd", "Bitbucket Pipeline", "CloudFormation (YAML)",
    "Avro", "Protocol Buffers", "GraphQL", "Gherkin Specification",
    "Extensible Stylesheet Language Transformations",
]
